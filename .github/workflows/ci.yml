name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m py_compile contextpack.py tests/test_contextpack.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self-pack smoke test
        run: python contextpack.py pack . --out CONTEXT.md --json context.json






















