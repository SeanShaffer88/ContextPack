[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextpack"
version = "0.1.0"
description = "Generate a compact, AI-ready brief for any code repo — stdlib only"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sean Shaffer" }]
keywords = ["context", "repository", "brief", "ai", "developer-tools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
contextpack = "contextpack:main"

[tool.setuptools]
py-modules = ["contextpack"]
